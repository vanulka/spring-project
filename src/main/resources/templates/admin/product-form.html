<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Форма товара</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 8px; width: 300px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 3px;}
    </style>
</head>
<body>
<!-- Заголовок меняется в зависимости от того, есть ли ID -->
<h2 th:text="${product.id == null ? 'Добавление нового товара' : 'Редактирование товара'}">Форма</h2>

<!-- Отправляем данные на /save через POST -->
<form th:action="@{/admin/products/save}" th:object="${product}" method="post">

    <!-- Скрытое поле для ID (нужно для редактирования) -->
    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label>Название товара:</label>
        <input type="text" th:field="*{name}" required />
    </div>

    <div class="form-group">
        <label>Цена:</label>
        <input type="number" step="0.01" th:field="*{price}" required />
    </div>

    <button type="submit">Сохранить</button>
    <a th:href="@{/admin/products}" style="margin-left: 10px;">Отмена</a>
</form>
</body>
</html>
