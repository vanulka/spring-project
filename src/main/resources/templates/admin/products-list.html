<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление товарами</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 3px; display: inline-block; }
        .btn-add { background-color: #28a745; }
        .btn-edit { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; }
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 800px; }
    </style>
</head>
<body>
<div class="header">
    <h2>Список товаров</h2>
    <a th:href="@{/admin/products/new}" class="btn btn-add">+ Добавить товар</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Цена</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <!-- Цикл по всем товарам из модели -->
    <tr th:each="product : ${products}">
        <td th:text="${product.id}">1</td>
        <td th:text="${product.name}">Название</td>
        <td th:text="${product.price}">0.0</td>
        <td>
            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-edit">Ред.</a>
            <a th:href="@{/admin/products/delete/{id}(id=${product.id})}" class="btn btn-delete"
               onclick="return confirm('Вы уверены, что хотите удалить этот товар?');">Удалить</a>
        </td>
    </tr>
    <!-- Если товаров нет -->
    <tr th:if="${products.isEmpty()}">
        <td colspan="4" style="text-align: center;">Список товаров пуст</td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/}">Назад на главную</a>
</body>
</html>
