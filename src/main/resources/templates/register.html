<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Регистрация</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    .error { color: red; font-size: 12px; display: block; margin-top: 3px; }
  </style>
</head>
<body>
<h2>Регистрация нового пользователя</h2>

<form th:action="@{/register}" th:object="${userDto}" method="post">
  <div class="form-group">
    <label>Имя пользователя:</label>
    <input type="text" th:field="*{username}" />
    <!-- Блок для вывода ошибки по полю username -->
    <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
  </div>

  <div class="form-group">
    <label>Email:</label>
    <input type="text" th:field="*{email}" />
    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
  </div>

  <div class="form-group">
    <label>Пароль:</label>
    <input type="password" th:field="*{password}" />
    <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
  </div>

  <div class="form-group">
    <label>Повторите пароль:</label>
    <input type="password" th:field="*{confirmPassword}" />
    <!-- Ошибка кастомной проверки (совпадение паролей) выведется здесь -->
    <span class="error" th:if="${#fields.hasErrors('passwordMatching')}" th:errors="*{passwordMatching}"></span>
    <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
  </div>

  <button type="submit">Зарегистрироваться</button>
</form>
<br>
<a th:href="@{/login}">Уже есть аккаунт? Войти</a>
</body>
</html>
