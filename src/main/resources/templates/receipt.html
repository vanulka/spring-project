<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Чек</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: monospace; text-align: center; margin-top: 50px;">
<h2>✅ Заказ успешно оформлен!</h2>
<p>Спасибо за покупку.</p>
<p>Сумма заказа: <strong th:text="${total} + ' руб.'"></strong></p>
<div style="border: 1px dashed black; display: inline-block; padding: 20px; margin-top: 20px;">
    <p>Ваш чек (Prototype ID):</p>
    <h3 th:text="${receiptId}"></h3>
</div>
<br><br>
<a href="/" style="text-decoration: none; padding: 10px; background: #007bff; color: white; border-radius: 5px;">Вернуться в магазин</a>
</body>
</html>
