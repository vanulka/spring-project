<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Магазин</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { display: flex; gap: 20px; }
        .products { flex: 2; }
        .cart { flex: 1; background: #f9f9f9; padding: 15px; border-radius: 5px; height: fit-content;}
        .product-card { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .btn { padding: 5px 10px; background: #007bff; color: white; border: none; cursor: pointer; text-decoration: none;}
        .btn-buy { background: #28a745; }
        .admin-link { float: right; }
    </style>
</head>
<body>
<div style="display: flex; justify-content: space-between;">
    <h1>Витрина магазина</h1>
    <div>
        <!-- Ссылка на админку видна только админу (в реальности лучше проверять через Thymeleaf Security, но пока оставим так) -->
        <a th:href="@{/admin/products}" class="admin-link">Админка</a> |
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" style="background:none; border:none; color:blue; cursor:pointer; text-decoration:underline;">Выйти</button>
        </form>
    </div>
</div>

<div class="container">
    <div class="products">
        <h3>Товары</h3>
        <div th:each="product : ${products}" class="product-card">
            <strong th:text="${product.name}">Название</strong> -
            <span th:text="${product.price} + ' руб.'">0</span>
            <form th:action="@{/cart/add}" method="post" style="display: inline; float: right;">
                <input type="hidden" name="productId" th:value="${product.id}">
                <button type="submit" class="btn btn-buy">В корзину</button>
            </form>
            <div style="clear: both;"></div>
        </div>
        <div th:if="${products.isEmpty()}">Товаров пока нет. Зайдите под админом и добавьте их!</div>
    </div>

    <div class="cart">
        <h3>Корзина</h3>
        <ul>
            <li th:each="item : ${cartItems}">
                <span th:text="${item.name}">Товар</span> - <span th:text="${item.price}">0</span>
            </li>
            <li th:if="${cartItems.isEmpty()}">Пусто</li>
        </ul>
        <hr>
        <strong>Итого: <span th:text="${cartTotal}">0</span> руб.</strong>
        <br><br>
        <a th:if="${!cartItems.isEmpty()}" th:href="@{/checkout}" class="btn btn-buy">Оформить заказ</a>
    </div>
</div>
</body>
</html>
